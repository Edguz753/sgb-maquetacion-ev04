<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <title>SGB · Sistema de Gestión de Beneficiarios</title>
    <script>
      // SPA en GitHub Pages: 404.html guarda la ruta original aquí y redirige
      // al index; este script la restaura sin recargar.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script>
      // Modo demo: restaurar el usuario desde localStorage ANTES de que React
      // arranque, para no perder la sesión en recargas / navegación directa.
      (function () {
        try {
          var raw = localStorage.getItem('sgb.user');
          if (raw && !localStorage.getItem('sgb.token')) {
            var u = JSON.parse(raw);
            if (u && u.username) localStorage.setItem('sgb.token', 'demo-token-' + u.username);
          }
        } catch (e) { /* ignorar */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
