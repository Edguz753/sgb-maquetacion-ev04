<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <title>SGB · Sistema de Gestión de Beneficiarios</title>
    <script>
      // SPA en GitHub Pages: 404.html guarda la ruta original aquí y redirige al index; 
      // este script la restaura sin recargar. Acepta la ruta con o sin el prefijo base.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect) {
          var base = '/sgb-maquetacion-ev04/';
          var target = redirect.indexOf(base) === 0 ? redirect : base + redirect.replace(/^\//, '');
          var actual = location.pathname + location.search + location.hash;
          if (target !== actual) history.replaceState(null, null, target);
        }
      })();
    </script>
    <script>
      // Modo demo: restaurar el usuario desde localStorage ANTES de que React arranque, 
      // para no perder la sesión en recargas / navegación directa.
      (function () {
        try {
          var raw = localStorage.getItem('sgb.user');
          if (raw && !localStorage.getItem('sgb.token')) {
            var u = JSON.parse(raw);
            if (u && u.username) localStorage.setItem('sgb.token', 'demo-token-' + u.username);
          }
        } catch (e) { /* ignorar */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
