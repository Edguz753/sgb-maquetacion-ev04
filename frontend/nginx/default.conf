server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API hacia el contenedor del backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Evidencias del archivo documental
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # index.html siempre revalidado (evita bundles viejos cacheados)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: cualquier ruta no encontrada cae al index (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets con hash
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}